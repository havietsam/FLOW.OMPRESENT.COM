<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Sanctuary | OMPRESENT FLOW</title>
    <style>
:root {
    --color-obsidian: #080c16;
    --color-surface: #0e1424;
    --color-surface-hover: #141c32;
    --color-gold: #b48f4e;
    --color-gold-bright: #d4af37;
    --color-gold-glow: rgba(180, 143, 78, 0.28);
    --color-dawn-glow: rgba(26, 35, 56, 0.7);
    --color-text-main: #f1f5f9;
    --color-text-muted: #94a3b8;
    --color-text-dark: #64748b;
    --font-serif: 'Playfair Display', Georgia, serif;
    --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

body {
    background-color: var(--color-obsidian);
    color: var(--color-text-main);
    font-family: var(--font-sans);
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
}

/* Ambient Radial Dawn Glow */
.ambient-glow {
    position: fixed;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 143, 78, 0.12) 0%, rgba(14, 20, 36, 0.6) 45%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(80px);
    animation: hrvBreathe 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes hrvBreathe {
    0%, 100% { transform: scale(0.92) translate(-50%, -10%); opacity: 0.6; }
    40% { transform: scale(1.15) translate(-50%, -6%); opacity: 0.95; }
    100% { transform: scale(0.92) translate(-50%, -10%); opacity: 0.6; }
}

/* Container */
.sanctuary-container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 10;
}

/* Brand Lockup */
.brand-lockup-flow {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
}
.brand-icon-mandala {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(180, 143, 78, 0.45));
    transition: transform 0.3s ease;
}
.brand-lockup-flow:hover .brand-icon-mandala {
    transform: rotate(15deg) scale(1.05);
}
.brand-typography {
    display: flex;
    flex-direction: column;
}
.brand-title-flow {
    font-family: var(--font-serif);
    font-size: 21px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.06em;
    line-height: 1.1;
}
.brand-tagline-flow {
    font-family: var(--font-sans);
    font-size: 9.5px;
    font-weight: 600;
    color: var(--color-gold);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-top: 3px;
}

/* Navigation Header */
.nav-header {
    padding: 18px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(24px);
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 12, 22, 0.88);
}
.nav-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}
.nav-links-desktop {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 13.5px;
    font-weight: 500;
}
.nav-links-desktop a {
    color: var(--color-text-muted);
    text-decoration: none;
    transition: color 0.2s ease;
}
.nav-links-desktop a:hover {
    color: var(--color-gold-bright);
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn-pill-action {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(180, 143, 78, 0.3);
    color: var(--color-text-main);
    padding: 8px 16px;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    text-decoration: none;
}
.btn-pill-action:hover {
    background: rgba(180, 143, 78, 0.15);
    border-color: var(--color-gold-bright);
    color: #fff;
}

/* Tri-Portal Banner */
.tri-portal-bar {
    background: linear-gradient(90deg, rgba(8, 12, 22, 0.95), rgba(180, 143, 78, 0.12), rgba(8, 12, 22, 0.95));
    border-bottom: 1px solid rgba(180, 143, 78, 0.2);
    padding: 8px 0;
    font-size: 12px;
    text-align: center;
    color: var(--color-text-muted);
}
.tri-portal-bar a {
    color: var(--color-gold);
    text-decoration: none;
    font-weight: 600;
    margin: 0 6px;
}
.tri-portal-bar a:hover {
    color: var(--color-gold-bright);
    text-decoration: underline;
}

/* Hero Section */
.hero-section {
    padding: 44px 0 32px;
    text-align: center;
}
.hero-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--color-gold-bright);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 700;
    background: rgba(180, 143, 78, 0.1);
    border: 1px solid rgba(180, 143, 78, 0.3);
    padding: 5px 16px;
    border-radius: 9999px;
    margin-bottom: 18px;
}
.hero-h1 {
    font-family: var(--font-serif);
    font-size: clamp(30px, 5.2vw, 52px);
    font-weight: 700;
    line-height: 1.18;
    color: #ffffff;
    max-width: 980px;
    margin: 0 auto 16px;
    letter-spacing: -0.01em;
}
.hero-p {
    font-size: clamp(15px, 2vw, 18px);
    color: var(--color-text-muted);
    max-width: 800px;
    margin: 0 auto 34px;
    font-weight: 400;
    line-height: 1.7;
}

/* Master Player Wrapper */
.master-player-wrapper {
    background: var(--color-surface);
    border: 1px solid rgba(180, 143, 78, 0.35);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px var(--color-gold-glow);
    margin-bottom: 50px;
    position: relative;
}
.player-ratio-box {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
}
.player-ratio-box iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
}

/* Player Bar Controls */
.player-bar {
    padding: 20px 28px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    background: linear-gradient(180deg, rgba(16, 23, 40, 0.95) 0%, rgba(10, 14, 26, 0.98) 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
}
.player-meta {
    display: flex;
    flex-direction: column;
    text-align: left;
    flex: 1 1 320px;
}
.player-meta-label {
    font-size: 11px;
    color: var(--color-gold);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
}
.player-meta-title {
    font-family: var(--font-serif);
    font-size: 19px;
    color: #ffffff;
    font-weight: 600;
    margin-top: 3px;
}

/* Flow Mode Switcher */
.flow-mode-switch {
    display: flex;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(180, 143, 78, 0.3);
    border-radius: 9999px;
    padding: 3px;
    gap: 4px;
}
.flow-mode-btn {
    background: transparent;
    border: none;
    color: var(--color-text-muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 9999px;
    cursor: pointer;
    transition: all 0.2s ease;
}
.flow-mode-btn.active {
    background: var(--color-gold);
    color: #080c16;
}

.btn-enter-flow {
    background: linear-gradient(135deg, var(--color-gold-bright) 0%, var(--color-gold) 100%);
    color: #080c16;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    padding: 14px 26px;
    border-radius: 9999px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(180, 143, 78, 0.4);
    transition: all 0.3s ease;
}
.btn-enter-flow:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(212, 175, 55, 0.55);
}

/* Somatic Breathing Pacer 0.1Hz Widget */
.breathing-widget {
    background: var(--color-surface);
    border: 1px solid rgba(180, 143, 78, 0.3);
    border-radius: 24px;
    padding: 36px 28px;
    margin-bottom: 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.pacer-visual-box {
    width: 140px;
    height: 140px;
    margin: 20px auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
.pacer-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(180, 143, 78, 0.3);
}
.pacer-core {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--color-gold-bright) 0%, var(--color-gold) 70%);
    box-shadow: 0 0 25px var(--color-gold);
    transition: transform 0.1s linear;
}
.pacer-instruction {
    font-family: var(--font-serif);
    font-size: 20px;
    color: #ffffff;
    font-weight: 600;
    margin-top: 12px;
}
.pacer-subtext {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-top: 6px;
}

/* Section Titles */
.section-header-box {
    text-align: center;
    margin-bottom: 40px;
}
.section-tag {
    font-size: 11px;
    color: var(--color-gold);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
}
.section-title {
    font-family: var(--font-serif);
    font-size: clamp(26px, 3.5vw, 38px);
    color: #ffffff;
    font-weight: 700;
}
.section-desc {
    font-size: 16px;
    color: var(--color-text-muted);
    max-width: 680px;
    margin: 10px auto 0;
}

/* Master Cards Grid */
.cards-grid-pentad {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 70px;
}
.master-card {
    background: var(--color-surface);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
    position: relative;
}
.master-card:hover {
    border-color: rgba(180, 143, 78, 0.5);
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(180, 143, 78, 0.2);
}
.card-thumb-wrap {
    position: relative;
    padding-bottom: 56.25%;
    overflow: hidden;
    background: #000;
}
.card-thumb-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}
.master-card:hover .card-thumb-wrap img {
    transform: scale(1.04);
}
.card-badge {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(8, 12, 22, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(180, 143, 78, 0.4);
    color: var(--color-gold-bright);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 4px 10px;
    border-radius: 9999px;
    text-transform: uppercase;
}
.card-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    flex: 1;
}
.card-ep {
    font-size: 11px;
    color: var(--color-gold);
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
}
.card-title {
    font-family: var(--font-serif);
    font-size: 17px;
    color: #ffffff;
    line-height: 1.35;
    margin-bottom: 10px;
}
.card-music {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-bottom: 16px;
    flex: 1;
}
.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 14px;
    font-size: 12px;
    color: var(--color-text-dark);
}
.btn-card-play {
    color: var(--color-gold);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* 3 Macro Silos Layout */
.silos-wrapper {
    margin-bottom: 80px;
}
.silo-card-wide {
    background: var(--color-surface);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 36px;
    margin-bottom: 32px;
    display: grid;
    grid-template-columns: 1fr 1.25fr;
    gap: 36px;
    align-items: center;
    transition: all 0.3s ease;
}
.silo-card-wide:hover {
    border-color: rgba(180, 143, 78, 0.45);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}
.silo-img-box {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    padding-bottom: 56.25%;
}
.silo-img-box img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
}
.silo-info-box {
    display: flex;
    flex-direction: column;
}
.silo-tag {
    font-size: 11px;
    color: var(--color-gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
}
.silo-title {
    font-family: var(--font-serif);
    font-size: 24px;
    color: #ffffff;
    line-height: 1.3;
    margin-bottom: 12px;
}
.silo-lead {
    font-size: 15px;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin-bottom: 20px;
}
.silo-sublinks {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 22px;
}
.silo-sublinks li a {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s ease;
}
.silo-sublinks li a:hover {
    color: var(--color-gold-bright);
}
.silo-btn {
    align-self: flex-start;
    background: rgba(180, 143, 78, 0.15);
    border: 1px solid var(--color-gold);
    color: var(--color-gold-bright);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 9999px;
    text-decoration: none;
    transition: all 0.2s ease;
}
.silo-btn:hover {
    background: var(--color-gold);
    color: #080c16;
}

/* Daytime Burnout Screener Widget */
.screener-box {
    background: linear-gradient(180deg, #0d1424 0%, #090e1a 100%);
    border: 1px solid rgba(180, 143, 78, 0.35);
    border-radius: 24px;
    padding: 40px 32px;
    margin-bottom: 80px;
    text-align: center;
}
.screener-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin: 28px 0;
    text-align: left;
}
.screener-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 16px 20px;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.screener-btn:hover, .screener-btn.selected {
    background: rgba(180, 143, 78, 0.18);
    border-color: var(--color-gold);
}
.screener-btn strong {
    color: var(--color-gold-bright);
    font-size: 15px;
}

/* Floating Mobile Mini-Player */
.mini-player-floating {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 520px;
    background: rgba(14, 20, 36, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(180, 143, 78, 0.4);
    border-radius: 9999px;
    padding: 12px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    z-index: 999;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}
.mini-player-left {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
}
.mini-pulse-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--color-gold-bright);
    box-shadow: 0 0 10px var(--color-gold-bright);
    animation: miniPulse 2s infinite ease-in-out;
    flex-shrink: 0;
}
.mini-player-text {
    font-family: var(--font-serif);
    font-size: 13.5px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
}
.mini-player-btn {
    background: var(--color-gold);
    color: #080c16;
    border: none;
    font-weight: 700;
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 9999px;
    cursor: pointer;
    flex-shrink: 0;
}

/* Footer */
.sanctuary-footer {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 60px 0 40px;
    text-align: center;
    background: #04070e;
    font-size: 13px;
    color: var(--color-text-dark);
}
.footer-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    text-decoration: none;
}
.footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin: 20px 0 28px;
}
.footer-links a {
    color: var(--color-text-muted);
    text-decoration: none;
}
.footer-links a:hover {
    color: var(--color-gold);
}
.medical-disclaimer {
    max-width: 800px;
    margin: 0 auto 20px;
    font-size: 11.5px;
    line-height: 1.6;
    color: #475569;
}

/* Responsive */
@media (max-width: 900px) {
    .nav-links-desktop { display: none; }
    .silo-card-wide { grid-template-columns: 1fr; padding: 26px; }
}
@media (max-width: 768px) {
    .sanctuary-container { padding: 0 16px; }
    .hero-h1 { font-size: 28px; }
    .player-bar { flex-direction: column; text-align: center; }
    .player-meta { text-align: center; }
    .btn-enter-flow { width: 100%; justify-content: center; }
    .cards-grid-pentad { grid-template-columns: 1fr; }
}
</style>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center;">
    <div class="sanctuary-container" style="max-width:600px;">
        <img src="assets/images/logo_mandala_gold.webp" alt="OMPRESENT Mandala" width="64" height="64" style="margin-bottom:20px;" />
        <h1 style="font-family:var(--font-serif); font-size:28px; color:#fff; margin-bottom:12px;">Offline Sanctuary Active</h1>
        <p style="color:var(--color-text-muted); font-size:15px; margin-bottom:30px;">
            You are currently disconnected from the Internet. Your biological breath is your eternal anchor. Follow the 0.1Hz rhythm below to maintain presence.
        </p>
        
        <div class="pacer-visual-box" style="margin:20px auto;">
            <div class="pacer-ring"></div>
            <div class="pacer-core" id="pacerCore"></div>
        </div>
        <div class="pacer-instruction" id="pacerInstruction">Breathe gently...</div>
        
        <button onclick="window.location.reload()" class="btn-enter-flow" style="margin-top:30px;">Reconnect ➔</button>
    </div>
    <script>
    let s = 0;
    const core = document.getElementById('pacerCore');
    const text = document.getElementById('pacerInstruction');
    setInterval(() => {
        s = (s + 1) % 10;
        if (s < 4) {
            core.style.transform = `scale(${1 + ((s+1)/4)*0.8})`;
            text.innerText = `Inhale... (${4-s}s)`;
        } else {
            core.style.transform = `scale(${1.8 - ((s-3)/6)*0.8})`;
            text.innerText = `Exhale slowly... (${10-s}s)`;
        }
    }, 1000);
    </script>
</body>
</html>
